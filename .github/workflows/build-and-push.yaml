name: Build and Push VaultLab Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{vars.AWS_REGION}}
  EC2_INSTANCE_ID: i-0382a156ecf8af0d9
  ECR_API_REPOSITORY: vaultlab-api
  ECR_WORKER_REPOSITORY: vaultlab-worker

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push API Image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f src/VaultLab.API/dockerfile \
            -t "$ECR_REGISTRY/${{ env.ECR_API_REPOSITORY }}:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/${{ env.ECR_API_REPOSITORY }}:$IMAGE_TAG"

      - name: Build and Push Worker Image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f src/VaultLab.Worker/dockerfile \
            -t "$ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Deployment Script
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ECR_REGISTRY="$(aws sts get-caller-identity \
            --query Account \
            --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"

          COMPOSE_B64="$(base64 -w 0 compose.yaml)"

          cat > deploy.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          mkdir -p /opt/vaultlab

          printf '%s' '__COMPOSE_B64__' \
            | base64 -d > /opt/vaultlab/compose.yaml

          export AWS_REGION='__AWS_REGION__'
          export ECR_REGISTRY='__ECR_REGISTRY__'
          export IMAGE_TAG='__IMAGE_TAG__'

          cd /opt/vaultlab

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

          docker compose -f compose.yaml config --quiet

          docker compose -f compose.yaml pull

          docker compose -f compose.yaml up -d

          docker compose -f compose.yaml ps
          REMOTE_SCRIPT

          sed -i "s|__COMPOSE_B64__|${COMPOSE_B64}|g" deploy.sh
          sed -i "s|__AWS_REGION__|${AWS_REGION}|g" deploy.sh
          sed -i "s|__ECR_REGISTRY__|${ECR_REGISTRY}|g" deploy.sh
          sed -i "s|__IMAGE_TAG__|${IMAGE_TAG}|g" deploy.sh

          SCRIPT_B64="$(base64 -w 0 deploy.sh)"

          COMMAND="printf '%s' '${SCRIPT_B64}' | base64 -d | bash"

          PARAMETERS="$(jq -n \
            --arg command "$COMMAND" \
            '{commands: [$command]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy VaultLab ${IMAGE_TAG}" \
            --timeout-seconds 600 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
        id: deployment

      - name: Wait for Deployment
        env:
          COMMAND_ID: ${{ steps.deployment.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                echo "VaultLab deployment succeeded."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Undeliverable|Terminated|InvalidPlatform)
                echo "Deployment failed with status: $STATUS"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the deployment command."
          exit 1
