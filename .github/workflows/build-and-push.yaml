name: Build and Push VaultLab Image

on:
  push:
    branches:
      - main
    workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{vars.AWS_REGION}}
  ECR_API_REPOSITORY: vaultlab-api
  ECR_WORKER_REPOSITORY: vaultlab-worker

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push API Image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f src/VaultLab.API/dockerfile \
            -t "$ECR_REGISTRY/${{ env.ECR_API_REPOSITORY }}:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/${{ env.ECR_API_REPOSITORY }}:$IMAGE_TAG"

      - name: Build and Push Worker Image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f src/VaultLab.Worker/dockerfile \
            -t "$ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG"
